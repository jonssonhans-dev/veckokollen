<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veckokollen</title>

<body class="bg-slate-200 text-slate-800 font-sans pb-24">

  <div id="app-container" class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl flex flex-col transition-all">
    
    <!-- Dynamisk Väder-Header -->
    <header id="weather-header" class="bg-gradient-to-br from-sky-200 via-sky-100 to-slate-50 px-4 pt-5 pb-3 border-b border-slate-200/80 sticky top-0 z-10 transition-colors duration-500">

        <div>

            <div id="week-nav-controls" class="hidden flex items-center gap-1 bg-white/80 border border-slate-200 rounded-full px-1.5 py-0.5 shadow-2xs">

              <button onclick="changeWeek(1)" class="text-xs font-bold text-slate-600 px-1.5 hover:text-indigo-600">▶</button>
              <button id="reset-week-btn" onclick="resetWeek()" class="hidden text-[10px] font-bold text-indigo-600 pl-1 border-l border-slate-200">Idag</button>
            </div>
            <span id="child-week-pill" class="text-[11px] font-bold bg-white/80 text-slate-700 border border-slate-200 px-2 py-0.5 rounded-full shadow-2xs">V.48</span>

            <p class="text-xs text-slate-600 font-medium" id="header-subtitle"></p>
          </div>
        </div>
        
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="openProfilePicker()" id="user-badge-btn" title="Välj användare, avatar & status" class="text-xs font-semibold px-2.5 py-1.5 rounded-full border bg-white/90 text-slate-800 border-slate-200 shadow-2xs flex items-center gap-1">
            <span>👤</span><span>Välj profil</span>
          </button>
          <button id="weekend-btn" onclick="selectWeekendView()" class="text-xs font-semibold px-2.5 py-1.5 rounded-full border transition bg-white/80 text-indigo-700 border-indigo-200 shadow-2xs">🎉 Helg</button>

      </div>

      <!-- Statusrad (Barnens humör/status + Nedräknare) -->

        <div id="family-moods" class="flex items-center gap-2 overflow-x-auto"></div>

    <!-- Huvudinnehåll -->

  <!-- Bottom Sheet -->

        </div>

            <span class="text-[11px] font-bold text-amber-900">✨ Smarta förslag (utifrån skollunchen)</span>
            <button type="button" onclick="updateSmartDinnerSuggestions(true)" class="text-[11px] font-bold text-indigo-600">↻ Nya tips</button>

        <input type="text" id="dinner-title" required placeholder="Välj ett tips ovan eller skriv middagsrätt..." class="w-full border border-slate-300 rounded-xl p-2.5 text-sm">

      <!-- Formulär 3: Läxa / Prov -->

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Vems läxa / prov?</label>
          <div class="grid grid-cols-2 gap-2" id="person-buttons-hw"></div>
        </div>
        <input type="text" id="hw-title" required placeholder="Ämne / Vad ska göras?" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Typ</label>
            <select id="hw-type" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm bg-white">

              <option value="exam">Prov / Inlämning (engångs)</option>

          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Klar senast (dag)</label>

          </div>
        </div>
        <button type="submit" class="w-full bg-rose-600 text-white font-semibold py-3 rounded-xl shadow-md">Lägg i pluggradarn</button>

  <!-- Profil-, Humör-, Avatar- & Nedräknings-modal -->
  <div id="profile-modal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-center justify-center p-4 overflow-y-auto">

      <!-- Byt avatar -->

      <!-- Föräldrainställningar: Varannan vecka + Nedräknare -->

          <span class="text-xs font-bold text-slate-700 block mb-1.5">🏠 Barnvecka (varannan vecka):</span>

            <button type="button" id="btn-even-weeks" onclick="setKidsWeekParity('even')" class="py-1.5 px-2.5 rounded-xl border text-xs font-semibold">Jämna veckor</button>

          </div>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-700 block mb-1">⏳ Nedräkning i toppen (valfritt):</span>
          <div class="grid grid-cols-5 gap-1.5">
            <input type="text" id="countdown-title-input" placeholder="T.ex. Jullov 🎄" class="col-span-3 border border-slate-300 rounded-lg px-2 py-1.5 text-xs">
            <input type="date" id="countdown-date-input" class="col-span-2 border border-slate-300 rounded-lg px-1.5 py-1.5 text-xs">
          </div>
          <button type="button" onclick="saveCountdown()" class="mt-1.5 text-[11px] font-bold text-indigo-600">Spara nedräkning</button>
        </div>
      </div>

      <button onclick="closeProfilePicker()" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-xl mt-4 text-sm">Klar</button>
    </div>

  <script>
    // ==========================================
    // 1. SUPABASE-KONFIGURATION
    // ==========================================
    const SUPABASE_URL = 'https://stymtfwmdhkiaruzqllo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_65AIXWtnRB3tMkLJAHsjLw_X92O1cXP';
    const ADMIN_PIN = '1234';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // State
    let currentUser = localStorage.getItem('veckokollen_user') || null;
    let isAdmin = currentUser === 'Pappa';
    let kidsWeekParity = localStorage.getItem('veckokollen_parity') || 'even';
    let weekOffset = 0; // 0 = innevarande vecka, +1 = nästa vecka osv.
    let isHomeworkOpen = true;
    let viewMode = 'day';
    let selectedPerson = currentUser || 'Elsa';
    let selectedHwPerson = (currentUser === 'Elsa' || currentUser === 'Nils') ? currentUser : 'Elsa';

    let avatars = { Elsa: '🦊', Nils: '🚀', Pappa: '☕', Alla: '🏠' };
    let moods = { Elsa: '', Nils: '', Pappa: '' };
    let countdownConfig = { title: 'Jullov 🎄', date: '2026-12-22' };

    const avatarChoices = ['🦊', '🐱', '🦄', '⚽', '🎨', '🚀', '🦖', '🎮', '🚴', '☕', '🎸', '🌟'];
    const moodChoices = [
      { code: '', label: 'Ingen' },
      { code: '⚡', label: '⚡ Pigg' },
      { code: '😴', label: '😴 Trött' },
      { code: '📚', label: '📚 Pluggar' },
      { code: '🎮', label: '🎮 Spelar' },
      { code: '⚽', label: '⚽ Träning' },
      { code: '😎', label: '😎 Chill' }
    ];

    let rawEvents = [];
    let homeworks = [];
    let schoolMenus = { lyckeby: {}, haga: {} };

    function getISOWeekNumber(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function buildWeekDays(offset = 0) {
      const now = new Date();
      now.setDate(now.getDate() + offset * 7);
      const dayOfWeek = now.getDay();
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diffToMonday);

      const todayIso = new Date().toISOString().split('T')[0];
      const names = [
        { short: 'Mån', full: 'Måndag' },
        { short: 'Tis', full: 'Tisdag' },
        { short: 'Ons', full: 'Onsdag' },
        { short: 'Tor', full: 'Torsdag' },
        { short: 'Fre', full: 'Fredag' },
        { short: 'Lör', full: 'Lördag' },
        { short: 'Sön', full: 'Söndag' }
      ];
      const months = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

      return names.map((n, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const iso = d.toISOString().split('T')[0];
        return {
          ...n,
          iso,
          weekday: d.getDay(),
          dateLabel: `${d.getDate()} ${months[d.getMonth()]}`,
          isWeekend: i >= 5,
          isToday: iso === todayIso,
          weather: null
        };
      });
    }

    let weekDays = buildWeekDays(0);
    let selectedDateIso = weekDays.find(d => d.isToday)?.iso || weekDays[0].iso;
    let weatherCache = {};

    function changeWeek(delta) {
      weekOffset += delta;
      weekDays = buildWeekDays(weekOffset);
      // Återapplicera cachat väder på nya datum
      weekDays.forEach(d => { if (weatherCache[d.iso]) d.weather = weatherCache[d.iso]; });
      selectedDateIso = weekDays.find(d => d.isToday)?.iso || weekDays[0].iso;
      updateUserUI();
      render();
    }

    function resetWeek() {
      weekOffset = 0;
      changeWeek(0);
    }

    function getDisplayedWeekNumber() {
      return getISOWeekNumber(new Date(weekDays[0].iso + 'T12:00:00'));
    }

    function isKidsWeek(weekNum) {
      const isEven = weekNum % 2 === 0;
      return (kidsWeekParity === 'even' && isEven) || (kidsWeekParity === 'odd' && !isEven);
    }

    function getExpandedEventsForWeek() {
      const weekStart = weekDays[0].iso;
      const weekEnd = weekDays[6].iso;
      const dispWeekNum = getDisplayedWeekNumber();
      const result = [];

      rawEvents.forEach(ev => {
        const rec = ev.recurrence || 'none';
        if (rec === 'none') {
          if (ev.event_date >= weekStart && ev.event_date <= weekEnd) {
            result.push(ev);
          }
        } else {
          const origDate = new Date(ev.event_date + 'T12:00:00');
          const origWeekday = origDate.getDay();
          const targetDay = weekDays.find(d => d.weekday === origWeekday);

          if (targetDay && targetDay.iso >= ev.event_date) {
            if (rec === 'weekly') {
              result.push({ ...ev, event_date: targetDay.iso, is_recurring_instance: true });
            } else if (rec === 'biweekly') {
              const origWeek = getISOWeekNumber(origDate);
              if (origWeek % 2 === dispWeekNum % 2) {
                result.push({ ...ev, event_date: targetDay.iso, is_recurring_instance: true });
              }
            }
          }
        }
      });
      return result;
    }

    const dinnerCatalog = [
      { title: "🌮 Tacos med tillbehör", tags: ["taco", "färs"] },
      { title: "🍝 Pasta Carbonara", tags: ["pasta", "spaghetti", "makaron"] },
      { title: "🍗 Ugnsrostad kyckling & klyftpotatis", tags: ["kyckling"] },
      { title: "🐟 Lax i ugn med potatis & kall sås", tags: ["fisk", "lax", "torsk", "sej"] },
      { title: "🥞 Pannkakor med sylt & grädde", tags: ["pannkak", "soppa"] },
      { title: "🍔 Hemmagjorda hamburgare", tags: ["färs", "burgare"] },
      { title: "🍛 Korv stroganoff med ris", tags: ["korv", "ris"] },
      { title: "🍕 Hemmagjord pizza", tags: ["pizza"] },
      { title: "🥩 Köttbullar & makaroner", tags: ["köttbull", "färs", "pasta"] },
      { title: "🍜 Wok med nudlar & grönsaker", tags: ["nudlar", "wok"] },
      { title: "🥔 Pyttipanna med stekt ägg", tags: ["pytt"] },
      { title: "🌯 Kycklingfajitas", tags: ["kyckling", "taco"] }
    ];

    async function loadAllData() {
      const [evRes, hwRes, profRes] = await Promise.all([
        db.from('events').select('*'),
        db.from('homeworks').select('*').order('due_date', { ascending: true }),
        db.from('profiles').select('*')
      ]);

      if (evRes.data) rawEvents = evRes.data;
      if (hwRes.data) homeworks = hwRes.data;
      if (profRes.data) {
        profRes.data.forEach(p => {
          if (p.person === '_countdown' && p.avatar) {
            try { countdownConfig = JSON.parse(p.avatar); } catch(e) {}
          } else if (p.person.startsWith('_mood_')) {
            const name = p.person.replace('_mood_', '');
            moods[name] = p.avatar;
          } else {
            avatars[p.person] = p.avatar;
          }
        });
      }
      updateUserUI();
      render();
    }

    async function fetchSchoolLunch() {
      try {
        const res = await fetch('/api/lunch');
        if (res.ok) {
          schoolMenus = await res.json();
          render();
        }
      } catch (e) {
        console.warn('Kunde inte hämta skolmat:', e);
      }
    }

    function interpretWeatherCode(code) {
      if (code === 0) return { icon: "☀️", text: "Klart" };
      if (code <= 3) return { icon: "⛅", text: "Halvklart" };
      if (code <= 48) return { icon: "🌫️", text: "Dimma" };
      if (code <= 67) return { icon: "🌧️", text: "Regn" };
      if (code <= 77) return { icon: "❄️", text: "Snö" };
      if (code <= 82) return { icon: "🌦️", text: "Regnskurar" };
      return { icon: "🌨️", text: "Snöbyar" };
    }

    function getClothingTip(temp, precipProb, code) {
      if (code >= 51 && code <= 67 || precipProb > 55) return "☔ Regnkläder";
      if (temp <= 0) return "🧤 Overall / Vinterjacka";
      if (temp <= 8) return "🧥 Vinterjacka";
      if (temp <= 15) return "🧥 Skaljacka";
      return "👕 T-shirt / Tröja";
    }

    async function fetchHaningeWeather() {
      try {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=59.167&longitude=18.145&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm&forecast_days=14";
        const res = await fetch(url);
        const data = await res.json();

        const currTemp = Math.round(data.current.temperature_2m);
        const currCode = data.current.weather_code;
        const currInfo = interpretWeatherCode(currCode);
        const clothTip = getClothingTip(currTemp, 0, currCode);

        const hour = new Date().getHours();
        const header = document.getElementById('weather-header');
        const title = document.getElementById('header-title');
        const sub = document.getElementById('header-subtitle');
        const statusBar = document.getElementById('status-bar');

        if (hour >= 19 || hour < 6) {
          header.className = "bg-gradient-to-br from-slate-800 via-indigo-950 to-slate-900 px-4 pt-5 pb-3 border-b border-slate-700 sticky top-0 z-10";
          title.classList.replace('text-slate-900', 'text-white');
          sub.classList.replace('text-slate-600', 'text-slate-300');
          statusBar.classList.add('text-slate-200', 'border-white/10');
        } else if (currCode >= 51) {
          header.className = "bg-gradient-to-br from-slate-300 via-sky-200 to-slate-100 px-4 pt-5 pb-3 border-b border-slate-200 sticky top-0 z-10";
        } else if (currCode === 0) {
          header.className = "bg-gradient-to-br from-amber-100 via-sky-100 to-slate-50 px-4 pt-5 pb-3 border-b border-slate-200 sticky top-0 z-10";
        }

        document.getElementById('current-weather-badge').innerHTML = `<span>${currInfo.icon}</span><span>${currTemp}°C • ${clothTip}</span>`;

        data.daily.time.forEach((dateStr, i) => {
          const info = interpretWeatherCode(data.daily.weather_code[i]);
          const maxT = Math.round(data.daily.temperature_2m_max[i]);
          const minT = Math.round(data.daily.temperature_2m_min[i]);
          const precip = data.daily.precipitation_probability_max[i];
          weatherCache[dateStr] = {
            icon: info.icon,
            tempRange: `${minT}° / ${maxT}°`,
            precip: precip > 25 ? `• ${precip}%` : ""
          };
          const dayObj = weekDays.find(d => d.iso === dateStr);
          if (dayObj) dayObj.weather = weatherCache[dateStr];
        });
        render();
      } catch (err) {
        console.warn('Väderfel:', err);
      }
    }

      if (user === 'Pappa') {

        if (pin !== ADMIN_PIN) return alert("Fel PIN-kod");

      currentUser = user;

      selectedPerson = user;

      openProfilePicker();
      render();

      openProfilePicker();
      render();

        dinnerSubmitBtn.textContent = "Önska middag";
        container.classList.replace('max-w-lg', 'max-w-md');
        weekendBtn.classList.remove('hidden');
        dayTabs.classList.remove('hidden');

        .filter(u => moods[u])
        .map(u => `<span class="bg-white/75 text-slate-800 px-2 py-0.5 rounded-full font-medium shrink-0">${avatars[u]} ${u}: ${moods[u]}</span>`)
        .join('');
      document.getElementById('family-moods').innerHTML = moodRow || `<span class="opacity-70">Tryck på din profil för humör/status</span>`;

        if (diffDays >= 0) {
          cdEl.innerHTML = `<span class="bg-indigo-600/90 text-white px-2 py-0.5 rounded-full font-bold shadow-2xs">⏳ ${diffDays === 0 ? 'Idag!' : diffDays + ' d'} • ${countdownConfig.title}</span>`;

    function canDeleteEvent(ev) {
      if (isAdmin) return true;
      if (!currentUser) return false;
      if (ev.status === 'pending' && (ev.person === currentUser || ev.created_by === currentUser || ev.person === 'Alla')) {
        return true;
      }
      return false;
    }

    let dinnerOffset = 0;
    function updateSmartDinnerSuggestions(shuffle = false) {
      if (shuffle) dinnerOffset += 4;
      const iso = document.getElementById('dinner-date').value;
      const lyckebyFood = (schoolMenus.lyckeby[iso] || '').toLowerCase();
      const hagaFood = (schoolMenus.haga[iso] || '').toLowerCase();
      const combinedLunch = `${lyckebyFood} ${hagaFood}`;

      const suitable = dinnerCatalog.filter(meal => !meal.tags.some(tag => combinedLunch.includes(tag)));
      const list = suitable.length ? suitable : dinnerCatalog;

      const picks = [];
      for (let i = 0; i < 4; i++) {
        picks.push(list[(dinnerOffset + i) % list.length]);
      }

      document.getElementById('lunch-context-hint').textContent = combinedLunch.trim()
        ? `Skolmat denna dag: ${schoolMenus.lyckeby[iso] || '-'} / ${schoolMenus.haga[iso] || '-'}`
        : "Inga skolluncher registrerade denna dag.";

      document.getElementById('smart-dinner-chips').innerHTML = picks.map(p => `
        <button type="button" onclick="quickFill('dinner', '${p.title}')" class="text-xs bg-white hover:bg-emerald-50 text-slate-800 px-2.5 py-1.5 rounded-lg border border-amber-300 shadow-2xs font-medium">
          ${p.title}
        </button>
      `).join('');
    }

    async function setAvatar(person, emo) {
      avatars[person] = emo;
      updateUserUI();
      openProfilePicker();
      render();
      await db.from('profiles').upsert({ person, avatar: emo });
    }

    document.getElementById('event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newEv = {
        event_date: document.getElementById('input-date').value,
        start_time: document.getElementById('input-time').value || null,
        person: selectedPerson,
        title: document.getElementById('input-title').value,
        status: isAdmin ? 'confirmed' : 'pending',
        is_dinner: false,
        recurrence: document.getElementById('input-recurrence').value
      };
      e.target.reset();
      closeSheet();
      const { data } = await db.from('events').insert([newEv]).select();
      if (data) {
        data[0].created_by = currentUser;
        rawEvents.push(data[0]);
        render();
      }
    });

    document.getElementById('dinner-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const author = currentUser || selectedPerson;
      const newEv = {
        event_date: document.getElementById('dinner-date').value,
        start_time: null,
        person: isAdmin ? 'Alla' : author,
        title: `Middag: ${document.getElementById('dinner-title').value}`,
        status: isAdmin ? 'confirmed' : 'pending',
        is_dinner: true,
        recurrence: 'none'
      };

      closeSheet();

        data[0].created_by = currentUser;

        render();
      }

    document.getElementById('homework-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const hwType = document.getElementById('hw-type').value;
      const newHw = {
        person: selectedHwPerson,
        title: document.getElementById('hw-title').value,
        hw_type: hwType,
        due_date: document.getElementById('hw-due').value,
        done: false,
        recurrence: hwType === 'weekly' ? 'weekly' : 'none'
      };
      e.target.reset();
      closeSheet();
      const { data } = await db.from('homeworks').insert([newHw]).select();
      if (data) { homeworks.push(data[0]); render(); }
    });

    async function toggleHomework(id) {
      const hw = homeworks.find(h => h.id === id);
      if (!hw) return;
      hw.done = !hw.done;
      render();
      await db.from('homeworks').update({ done: hw.done }).eq('id', id);
    }

    async function advanceWeeklyHomework(id) {
      const hw = homeworks.find(h => h.id === id);
      if (!hw) return;
      const d = new Date(hw.due_date + 'T12:00:00');
      d.setDate(d.getDate() + 7);
      const nextIso = d.toISOString().split('T')[0];
      hw.due_date = nextIso;
      hw.done = false;
      render();
      await db.from('homeworks').update({ due_date: nextIso, done: false }).eq('id', id);
    }

    async function deleteHomework(id) {
      if (!confirm("Ta bort denna läxa?")) return;
      homeworks = homeworks.filter(h => h.id !== id);
      render();
      await db.from('homeworks').delete().eq('id', id);
    }

    async function approveEvent(id) {
      const ev = rawEvents.find(e => e.id === id);
      if (!ev) return;
      const reply = prompt("Valfritt svar/kommentar till barnen (lämna tomt för att bara godkänna):", "");
      ev.status = 'confirmed';
      if (reply && reply.trim()) {
        ev.title = `${ev.title} (${reply.trim()})`;
      }
      render();
      await db.from('events').update({ status: 'confirmed', title: ev.title }).eq('id', id);
    }

    async function deleteEvent(id) {
      const ev = rawEvents.find(e => e.id === id);
      if (ev && ev.recurrence && ev.recurrence !== 'none') {
        if (!confirm("Detta är en återkommande aktivitet. Vill du ta bort hela serien?")) return;
      }
      rawEvents = rawEvents.filter(e => e.id !== id);
      render();
      await db.from('events').delete().eq('id', id);
    }

    function getPersonDisplay(person) {
      const emo = avatars[person] || '👤';
      if (person === 'Elsa') return { label: `${emo} Elsa`, cls: 'bg-indigo-100 text-indigo-700' };
      if (person === 'Nils') return { label: `${emo} Nils`, cls: 'bg-emerald-100 text-emerald-700' };
      if (person === 'Pappa') return { label: `${emo} Pappa`, cls: 'bg-slate-200 text-slate-700' };
      return { label: `${emo} Alla`, cls: 'bg-purple-100 text-purple-700' };
    }

    function formatDueDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      const days = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];
      const isNextWeek = iso > weekDays[6].iso;
      return {
        text: `${isNextWeek ? 'Nästa ' : ''}${days[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`,
        isNextWeek
      };
    }

    function renderHomeworkRadar() {
      const openTasks = homeworks.filter(h => !h.done);
      const allDone = homeworks.length > 0 && openTasks.length === 0;

      const statusBadge = allDone
        ? `<span class="text-[11px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Allt klart! 🎉</span>`
        : `<span class="text-[11px] font-bold bg-rose-200/80 text-rose-900 px-2 py-0.5 rounded-full">${openTasks.length} kvar</span>`;

      const listHtml = isHomeworkOpen ? `
        <div class="space-y-1.5 mt-2.5 pt-2 border-t border-rose-200/60">
          ${homeworks.length === 0 ? `<p class="text-xs text-slate-500 italic">Inga läxor eller prov inlagda.</p>` : ''}
          ${homeworks.map(hw => {
            const p = getPersonDisplay(hw.person);
            const due = formatDueDate(hw.due_date);
            const canDelHw = isAdmin || (currentUser && hw.person === currentUser);
            const isWeekly = hw.hw_type === 'weekly';
            return `
              <div class="flex items-center justify-between gap-2 bg-white px-2.5 py-2 rounded-lg border ${hw.done ? 'border-slate-100 opacity-75' : 'border-rose-100'}">
                <div class="flex items-center gap-2.5 min-w-0">
                  <input type="checkbox" ${hw.done ? 'checked' : ''} onchange="toggleHomework('${hw.id}')" class="w-4 h-4 rounded accent-rose-600 shrink-0 cursor-pointer">
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${p.cls}">${p.label}</span>
                      <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded ${hw.hw_type === 'exam' ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'}">
                        ${hw.hw_type === 'exam' ? '🎯 Prov' : '🔄 Veckoläxa'}
                      </span>
                      <span class="text-[11px] font-semibold ${due.isNextWeek ? 'text-amber-700' : 'text-slate-500'}">→ ${due.text}</span>
                    </div>
                    <p class="text-xs font-medium text-slate-800 mt-0.5 truncate ${hw.done ? 'line-through' : ''}">${hw.title}</p>
                  </div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  ${(isWeekly && hw.done) ? `<button onclick="advanceWeeklyHomework('${hw.id}')" title="Ladda nästa veckas läxa" class="text-[10px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 px-1.5 py-1 rounded">↻ Nästa v.</button>` : ''}
                  ${canDelHw ? `<button onclick="deleteHomework('${hw.id}')" title="Ta bort" class="text-slate-400 hover:text-rose-600 text-xs px-1.5 py-1">✕</button>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      ` : '';

      return `
        <section class="${allDone ? 'bg-emerald-50/70 border-emerald-200' : 'bg-rose-50/80 border-rose-200'} border rounded-xl p-3 shadow-xs transition-colors">
          <div class="flex justify-between items-center">
            <button onclick="isHomeworkOpen = !isHomeworkOpen; render();" class="flex items-center gap-2 text-left flex-1">
              <span class="text-xs font-bold text-slate-500 w-3">${isHomeworkOpen ? '▾' : '▸'}</span>
              <span class="text-xs font-bold uppercase tracking-wider ${allDone ? 'text-emerald-900' : 'text-rose-900'}">📚 Pluggradar</span>
              ${statusBadge}
            </button>
            <button onclick="openSheet(null, 'homework')" class="text-[11px] font-bold text-rose-700 bg-white border border-rose-200 px-2 py-0.5 rounded-md shadow-2xs">+ Läxa/Prov</button>
          </div>
          ${listHtml}
        </section>
      `;
    }

    function renderWeatherPill(w) {
      if (!w) return '';
      return `<span class="text-[11px] font-medium text-sky-800 bg-sky-50 px-2 py-0.5 rounded-md border border-sky-100">${w.icon} ${w.tempRange} ${w.precip}</span>`;
    }

    function renderCompactEvent(ev) {
      const isPending = ev.status === 'pending';
      const p = getPersonDisplay(ev.person);
      const cardBg = isPending ? 'bg-amber-50 border-amber-300 border-dashed' : (ev.is_dinner ? 'bg-emerald-50/60 border-emerald-200' : 'bg-slate-50 border-slate-200');
      const allowDelete = canDeleteEvent(ev);
      const recIcon = ev.recurrence === 'weekly' ? '🔄' : (ev.recurrence === 'biweekly' ? '🔁' : '');

      return `
        <div class="px-2.5 py-2 rounded-lg border flex justify-between items-center gap-2 ${cardBg}">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${p.cls}">${p.label}</span>
              ${ev.start_time ? `<span class="text-[11px] font-semibold text-slate-500">${ev.start_time}</span>` : ''}
              ${recIcon ? `<span class="text-[10px] text-slate-400" title="Återkommande">${recIcon}</span>` : ''}
              ${isPending ? `<span class="text-[10px] font-bold text-amber-700 uppercase">Förslag</span>` : ''}
            </div>
            <p class="text-xs font-medium text-slate-800 mt-0.5 truncate">${ev.title}</p>
          </div>
          ${(isAdmin || allowDelete) ? `
            <div class="flex gap-1 shrink-0">
              ${(isAdmin && isPending) ? `<button onclick="approveEvent('${ev.id}')" title="Godkänn" class="bg-emerald-600 text-white w-7 h-7 rounded-md font-bold text-xs shadow-xs">✓</button>` : ''}
              ${allowDelete ? `<button onclick="deleteEvent('${ev.id}')" title="Ta bort" class="bg-white border border-slate-200 text-slate-500 hover:text-rose-600 w-7 h-7 rounded-md font-bold text-xs">✕</button>` : ''}
            </div>
          ` : ''}
        </div>
      `;

              const dayEvents = events.filter(e => e.event_date === d.iso).sort((a, b) => (a.start_time || "99:99").localeCompare(b.start_time || "99:99"));
              return `
                <div class="bg-white rounded-xl p-2.5 border border-indigo-200 shadow-xs flex flex-col justify-between">

            <span>${d.short}</span>
            <span class="text-[10px] opacity-80 mt-0.5">${d.weather ? d.weather.icon : d.dateLabel.split(' ')[0]}</span>
            ${hasPending ? `<span class="absolute top-1 right-1 w-2 h-2 rounded-full ${isSelected ? 'bg-amber-300' : 'bg-amber-500'}"></span>` : ''}
          </button>
        `;
      }).join('');

      const main = document.getElementById('main-content');
      const currentDay = weekDays.find(d => d.iso === selectedDateIso) || weekDays[0];
      document.getElementById('header-subtitle').textContent = viewMode === 'weekend' ? "Helgöversikt" : `${currentDay.full} ${currentDay.dateLabel}`;

      if (viewMode === 'weekend') {
        const weekendCards = weekDays.slice(5, 7).map(d => {
          const dayEvents = events.filter(e => e.event_date === d.iso).sort((a, b) => (a.start_time || "99:99").localeCompare(b.start_time || "99:99"));
          return `
            <section class="space-y-2">
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <h2 class="text-sm font-bold text-slate-800">${d.full} ${d.dateLabel}</h2>
                  ${renderWeatherPill(d.weather)}
                </div>
                <button onclick="openSheet('${d.iso}', 'event')" class="text-xs font-semibold text-indigo-600">+ Föreslå</button>
              </div>
              ${dayEvents.length ? dayEvents.map(renderCompactEvent).join('') : `<div class="text-center py-4 text-xs text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">Inget planerat ännu</div>`}
            </section>
          `;
        }).join('');
        main.innerHTML = renderHomeworkRadar() + weekendCards;
      } else {
        const dayEvents = events.filter(e => e.event_date === currentDay.iso).sort((a, b) => (a.start_time || "99:99").localeCompare(b.start_time || "99:99"));
        const schoolFoodHtml = !currentDay.isWeekend ? `
          <section>
            <div class="flex justify-between items-center mb-2">
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">🍽️ Skolmaten idag</h2>
              <button onclick="openSheet('${currentDay.iso}', 'dinner')" class="text-[11px] font-bold text-emerald-700">+ Önska middag</button>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
                <span class="text-[11px] font-bold text-indigo-600 block">${avatars.Elsa} Lyckebyskolan</span>
                <p class="text-xs text-slate-700 mt-1">${schoolMenus.lyckeby[currentDay.iso] || 'Ingen meny'}</p>
              </div>
              <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
                <span class="text-[11px] font-bold text-emerald-600 block">${avatars.Nils} Hagaskolan</span>
                <p class="text-xs text-slate-700 mt-1">${schoolMenus.haga[currentDay.iso] || 'Ingen meny'}</p>
              </div>
            </div>
          </section>
        ` : '';

        main.innerHTML = `
          ${renderHomeworkRadar()}
          ${schoolFoodHtml}
          <section>
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">📅 Planering & Förslag</h2>
            <div class="space-y-2">
              ${dayEvents.length ? dayEvents.map(renderCompactEvent).join('') : `<div class="text-center py-6 text-xs text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">Inget inplanerat denna dag</div>`}
            </div>
          </section>
        `;
      }
    }

    function renderPersonSelectors() {
      const options = isAdmin ? ['Elsa', 'Nils', 'Pappa', 'Alla'] : [currentUser || 'Elsa', 'Alla'];
      document.getElementById('person-buttons-event').innerHTML = options.map(p => `
        <button type="button" onclick="selectedPerson='${p}'; renderPersonSelectors();" class="border rounded-lg py-2 text-xs font-medium ${selectedPerson === p ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'border-slate-200 text-slate-600'}">
          ${avatars[p]} ${p}
        </button>
      `).join('');

      document.getElementById('person-buttons-hw').innerHTML = ['Elsa', 'Nils'].map(p => `
        <button type="button" onclick="selectedHwPerson='${p}'; renderPersonSelectors();" class="border rounded-lg py-2 text-xs font-medium ${selectedHwPerson === p ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'border-slate-200 text-slate-600'}">
          ${avatars[p]} ${p}
        </button>
      `).join('');

      // Snabbval anpassade efter barn vs förälder
      const chips = isAdmin
        ? ['🚗 Skjutsa / Hämta', '🎒 Packa gympapåse', '⚽ Träning', '🏠 Kompis hem']
        : ['🏠 Ta med kompis hem', '👋 Leka hos kompis', '🎮 Spelstund', '🎬 Filmkväll'];
      document.getElementById('quick-fill-chips').innerHTML = chips.map(c => `
        <button type="button" onclick="quickFill('event', '${c}')" class="text-xs bg-slate-100 hover:bg-indigo-50 px-2.5 py-1 rounded-full border border-slate-200">${c}</button>
      `).join('');
    }

    function render() {
      renderPersonSelectors();
      if (isAdmin) renderParentOverview();
      else renderChildView();
    }

    function selectWeekendView() { viewMode = 'weekend'; selectedDateIso = weekDays[5].iso; render(); }
    function quickFill(target, text) {
      if (target === 'event') document.getElementById('input-title').value = text;
      if (target === 'dinner') document.getElementById('dinner-title').value = text;
    }

    function setFormCategory(cat) {
      document.getElementById('event-form').classList.toggle('hidden', cat !== 'event');
      document.getElementById('dinner-form').classList.toggle('hidden', cat !== 'dinner');
      document.getElementById('homework-form').classList.toggle('hidden', cat !== 'homework');
      document.getElementById('tab-type-event').className = cat === 'event' ? "py-1.5 text-xs font-bold rounded-lg bg-white shadow-xs text-slate-900" : "py-1.5 text-xs font-bold rounded-lg text-slate-500";
      document.getElementById('tab-type-dinner').className = cat === 'dinner' ? "py-1.5 text-xs font-bold rounded-lg bg-white shadow-xs text-emerald-700" : "py-1.5 text-xs font-bold rounded-lg text-slate-500";
      document.getElementById('tab-type-homework').className = cat === 'homework' ? "py-1.5 text-xs font-bold rounded-lg bg-white shadow-xs text-rose-700" : "py-1.5 text-xs font-bold rounded-lg text-slate-500";
      if (cat === 'dinner') updateSmartDinnerSuggestions();
    }

    function openSheet(forcedIso = null, category = 'event') {
      if (!currentUser) {
        openProfilePicker();
        return;
      }
      selectedPerson = currentUser;
      const iso = forcedIso || selectedDateIso;
      document.getElementById('input-date').value = iso;
      document.getElementById('dinner-date').value = iso;
      document.getElementById('hw-due').value = iso;
      setFormCategory(category);
      renderPersonSelectors();
      document.getElementById('bottom-sheet').classList.remove('hidden');
    }

    function closeSheet() { document.getElementById('bottom-sheet').classList.add('hidden'); }

    function openProfilePicker() {
      const users = ['Elsa', 'Nils', 'Pappa'];
      document.getElementById('active-user-selector').innerHTML = users.map(u => {
        const active = currentUser === u;
        return `
          <button type="button" onclick="switchUser('${u}')" class="p-2.5 rounded-xl border text-center transition ${active ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-300' : 'bg-slate-50 border-slate-200'}">
            <span class="text-2xl block">${avatars[u]}</span>
            <span class="text-xs font-bold text-slate-800 block mt-1">${u}</span>
          </button>
        `;
      }).join('');

      const target = currentUser || 'Elsa';
      document.getElementById('editing-avatar-name').textContent = target;
      document.getElementById('editing-mood-name').textContent = target;

      document.getElementById('mood-grid').innerHTML = moodChoices.map(m => `
        <button type="button" onclick="setMood('${target}', '${m.code}')" class="px-2 py-1 rounded-lg text-xs border ${moods[target] === m.code ? 'bg-indigo-100 border-indigo-400 font-bold' : 'bg-slate-50 border-slate-200'}">${m.label}</button>
      `).join('');

      document.getElementById('avatar-emoji-grid').innerHTML = avatarChoices.map(emo => `
        <button type="button" onclick="setAvatar('${target}', '${emo}')" class="w-8 h-8 rounded-lg text-base flex items-center justify-center ${avatars[target] === emo ? 'bg-indigo-100 ring-2 ring-indigo-500' : 'bg-slate-100 hover:bg-slate-200'}">${emo}</button>
      `).join('');

      const adminBox = document.getElementById('admin-settings-box');
      if (isAdmin) {
        adminBox.classList.remove('hidden');
        document.getElementById('btn-even-weeks').className = `py-1.5 px-2.5 rounded-xl border text-xs font-semibold ${kidsWeekParity === 'even' ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-600'}`;
        document.getElementById('btn-odd-weeks').className = `py-1.5 px-2.5 rounded-xl border text-xs font-semibold ${kidsWeekParity === 'odd' ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-600'}`;
        document.getElementById('countdown-title-input').value = countdownConfig.title || '';
        document.getElementById('countdown-date-input').value = countdownConfig.date || '';
      } else {
        adminBox.classList.add('hidden');
      }

      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfilePicker() { document.getElementById('profile-modal').classList.add('hidden'); }

    // Starta appen
    updateUserUI();
    render();
    loadAllData();
    fetchSchoolLunch();
    fetchHaningeWeather();
  </script>
</body>
</html>
